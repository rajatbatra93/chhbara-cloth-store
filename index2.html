<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Chhabra Cloth Store" />
  <title>Chhabra Cloth Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fefefe;
    }

    /* Top Banner with logo and heading on vintage image */
    .top-banner {
      position: relative;
      text-align: center;
    }

    .top-banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-banner .text-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.8);
      padding: 15px 25px;
      border-radius: 10px;
    }

    .top-banner .text-content img {
      max-height: 60px;
    }

    .top-banner .text-content h1 {
      margin: 10px 0 5px;
      font-size: 1.8em;
    }

    /* Middle section with peacock image and clickable products */
    .middle-section {
      background: url('peacock.jpg') no-repeat center center;
      background-size: cover;
      padding: 60px 20px;
    }

    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.85);
      padding: 30px;
      border-radius: 12px;
    }

    .product-item {
      text-align: center;
    }

    .product-item img {
      max-width: 200px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .product-item img:hover {
      transform: scale(1.05);
    }

    /* Bottom banner with address on vintage image */
    .bottom-banner {
      position: relative;
      text-align: center;
    }

    .bottom-banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    .bottom-banner .footer-text {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: #000;
      font-weight: bold;
      font-size: 1em;
      background-color: rgba(255, 255, 255, 0.6);
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- Top Banner with Logo and Heading -->
  <div class="top-banner">
    <img src="vintage.jpg" alt="Top Banner" />
    <div class="text-content">
      <img src="logo.png" alt="Chhabra Cloth Store Logo" />
      <h1>Chhabra Cloth Store</h1>
      <p>Quality Ladies Wear - Suits, Sweaters, Blazers</p>
    </div>
  </div>

  <!-- Product Section on Peacock Background -->
  <section class="middle-section">
    <div class="product-grid">
      <div class="product-item">
        <a href="elegant-suit.html">
          <img src="suit1.jpg" alt="Elegant Indian Suit" />
          <p>Elegant Indian Suit</p>
        </a>
      </div>
      <div class="product-item">
        <a href="festive-suit.html">
          <img src="suit2.jpg" alt="Festive Indian Suit" />
          <p>Festive Indian Suit</p>
        </a>
      </div>
      <div class="product-item">
        <a href="sweater.html">
          <img src="sweater1.jpg" alt="Sweater" />
          <p>Warm Sweater Collection</p>
        </a>
      </div>
      <div class="product-item">
        <a href="blazer.html">
          <img src="blazer1.jpg" alt="Blazer" />
          <p>Stylish Winter Blazer</p>
        </a>
      </div>
    </div>
  </section>

  <!-- Bottom Banner with Address -->
  <div class="bottom-banner">
    <img src="vintage.jpg" alt="Bottom Banner" />
    <div class="footer-text">
      Chhabra Cloth Store - Sonipat, Kache Quarter Ashok Nagar, Dr Karamchand Wali Gali
    </div>
  </div>

</body>
</html>
